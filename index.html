<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datacenter Clicker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect x=%221%22 y=%222%22 width=%2214%22 height=%229%22 rx=%221%22 fill=%224fd1c5%22/><rect x=%226%22 y=%2211%22 width=%224%22 height=%222%22 fill=%224fd1c5%22/></svg>">
<script>
  // Cache-bust with a fresh value every page load, so a returning player
  // never gets a stale copy of the stylesheet from the browser's HTTP
  // cache - no server cache-control config or manual version bumping
  // needed. See the matching script loader at the end of <body> for the
  // same trick applied to the JS files, and js/core/updatecheck.js for
  // what auto-reloads a tab that's been left open across a deploy.
  document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');
</script>
</head>
<body>
<!-- DEV MODE — testing-only speed controls. Delete this <div> (and the
     matching CSS, JS wiring, and devmode.js) to remove dev mode. -->
<div id="dev-mode-panel">
  <span class="dev-label">DEV MODE</span>
  <span class="dev-group-label">Speed</span>
  <button data-speed="1" class="active">1x</button>
  <button data-speed="10">10x</button>
  <button data-speed="100">100x</button>
  <span class="dev-group-label">Costs</span>
  <button data-cost="0.1">0.1x</button>
  <button data-cost="1" class="active">1x</button>
  <button data-cost="10">10x</button>
  <button id="btn-cost-scaling">Cost Scaling: OFF</button>
  <button id="btn-edit-state">Edit State</button>
</div>

<!-- DEV MODE — raw state editor. Delete this <div> along with the
     bindDevStateEditor() wiring in main.js to remove it. -->
<div id="dev-state-editor" hidden>
  <div class="dev-state-actions">
    <button id="btn-state-refresh">Refresh from game</button>
    <button id="btn-state-apply">Apply to game</button>
  </div>
  <textarea id="dev-state-textarea" spellcheck="false"></textarea>
</div>

<header id="top-bar">
  <h1>Datacenter Clicker</h1>
  <div id="era-banner"></div>
  <div id="model-banner"></div>
</header>

<div id="status-bar">
  <span id="status-time">Day 0 • Nov 30, 2022, 12:00 AM</span>
  <span id="status-tokens">0 tokens/s</span>
  <span id="status-net">Net: $0.00/s • ARR: $0.00</span>
  <span id="status-gdp">0% of US GDP</span>
  <span id="status-us-elec">0% of US electricity</span>
  <div id="token-price-wrap">
    <label for="token-price-input">Price: $<input type="number" id="token-price-input" min="0" step="0.01" value="1.00">/M tokens</label>
  </div>
  <div id="elec-price-wrap">
    <label for="elec-price-input">Price: $<input type="number" id="elec-price-input" min="0" step="0.01" value="0.10">/kWh</label>
  </div>
  <div id="clock-speed-wrap">
    <label for="clock-speed-slider">Clock Speed: <span id="clock-speed-label">1x</span></label>
    <input type="range" id="clock-speed-slider" min="0" max="20" step="0.5" value="1">
  </div>
</div>

<div id="resource-bar"></div>
<div id="electricity-bar"></div>
<div id="water-bar"></div>

<main>
  <section id="actions-panel">
    <h2>Actions</h2>
    <div id="core-actions" class="action-row">
      <button id="btn-freelance">Freelance (DoorDash)<span class="hint" id="freelance-hint">$15/click • 12 shifts/day</span></button>
      <button id="btn-software-job" class="toggle-btn">Software Job<span class="hint" id="software-job-hint">$100k/yr • OFF</span></button>
    </div>
    <div id="token-actions" class="action-row token-alloc-row">
      <button id="btn-auto-convert" class="toggle-btn">Auto-Convert Tokens: OFF<span class="hint">continuously converts tokens → cash/research points</span></button>
      <div id="alloc-slider-wrap">
        <label for="alloc-slider">Sell <span id="alloc-sell-pct">50</span>% &nbsp;/&nbsp; Train <span id="alloc-train-pct">50</span>%</label>
        <input type="range" id="alloc-slider" min="0" max="100" value="50" step="5">
      </div>
    </div>
  </section>

  <div id="catalog-toolbar">
    <button id="btn-toggle-hidden" hidden>Show minimized (0)</button>
  </div>

  <div id="catalog-grid">
    <section id="compute-panel" class="catalog-column">
      <h2>Compute</h2>
      <div id="compute-list" class="card-grid"></div>
    </section>

    <section id="buildings-panel" class="catalog-column">
      <h2>Buildings</h2>
      <div id="buildings-list" class="card-grid"></div>
    </section>

    <section id="power-panel" class="catalog-column">
      <h2>Power</h2>
      <div id="power-list" class="card-grid"></div>
    </section>

    <section id="research-panel" class="catalog-column">
      <h2>Research</h2>
      <div id="research-list" class="card-grid"></div>
    </section>

    <section id="regulatory-panel" class="catalog-column">
      <h2>Regulatory</h2>
      <div id="regulatory-list" class="card-grid"></div>
    </section>

    <section id="company-panel" class="catalog-column">
      <h2>Company</h2>
      <div id="company-list" class="card-grid"></div>
    </section>

    <section id="quantum-panel" class="catalog-column">
      <h2>Quantum</h2>
      <div id="quantum-list" class="card-grid"></div>
    </section>

    <section id="configurations-panel" class="catalog-column">
      <h2>Configurations</h2>
      <div id="configurations-list" class="card-grid"></div>
    </section>

    <section id="upgrades-panel" class="catalog-column">
      <h2>Upgrades</h2>
      <div id="upgrades-list" class="card-grid"></div>
    </section>
  </div>

  <section id="log-panel">
    <h2>Log</h2>
    <div id="log-list"></div>
  </section>

  <section id="save-panel">
    <h2>Save</h2>
    <div class="action-row">
      <button id="btn-save">Save</button>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
      <button id="btn-reset">Reset Progress</button>
    </div>
    <textarea id="io-textarea" placeholder="Export/import save string goes here"></textarea>
  </section>
</main>

<div id="flash-message"></div>

<!-- Generic alert popup - Game.ui.showAlert(title, message) from anywhere
     (see main.js bindBuildingButtons for the "blocked purchase" use case). -->
<div id="alert-overlay" hidden>
  <div id="alert-box">
    <div id="alert-title"></div>
    <div id="alert-message"></div>
    <button id="alert-ok-btn">OK</button>
  </div>
</div>

<script>
  // Same cache-busting trick as the stylesheet above, for every game
  // script - a fresh ?v= on every page load means a returning player
  // always gets the current code, never a browser-cached stale copy, with
  // no server config or manual version bumping required. document.write
  // (called synchronously here, during initial parse) inserts these as
  // normal <script> tags in the parse stream, so load order and the
  // DOMContentLoaded timing main.js relies on are unaffected.
  var v = Date.now();
  [
    'js/core/config.js',
    'js/core/devmode.js',
    'js/core/format.js',
    'js/data/resources.js',
    'js/data/eras.js',
    'js/data/buildings.js',
    'js/data/upgrades.js',
    'js/data/milestones.js',
    'js/core/state.js',
    'js/core/effects.js',
    'js/core/engine.js',
    'js/core/actions.js',
    'js/core/save.js',
    'js/core/updatecheck.js',
    'js/ui/render.js',
    'js/main.js',
  ].forEach(function (src) {
    document.write('<script src="' + src + '?v=' + v + '"><\/script>');
  });
</script>
</body>
</html>
