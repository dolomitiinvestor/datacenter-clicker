<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datacenter Clicker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🖥️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- DEV MODE — testing-only speed controls. Delete this <div> (and the
     matching CSS, JS wiring, and devmode.js) to remove dev mode. -->
<div id="dev-mode-panel">
  <span class="dev-label">⚙ DEV MODE</span>
  <span class="dev-group-label">Speed</span>
  <button data-speed="1" class="active">1x</button>
  <button data-speed="10">10x</button>
  <button data-speed="100">100x</button>
  <span class="dev-group-label">Costs</span>
  <button data-cost="0.1">0.1x</button>
  <button data-cost="1" class="active">1x</button>
  <button data-cost="10">10x</button>
  <button id="btn-cost-scaling" class="active">Cost Scaling: ON</button>
  <button id="btn-edit-state">✏️ Edit State</button>
</div>

<!-- DEV MODE — raw state editor. Delete this <div> along with the
     bindDevStateEditor() wiring in main.js to remove it. -->
<div id="dev-state-editor" hidden>
  <div class="dev-state-actions">
    <button id="btn-state-refresh">🔄 Refresh from game</button>
    <button id="btn-state-apply">✅ Apply to game</button>
  </div>
  <textarea id="dev-state-textarea" spellcheck="false"></textarea>
</div>

<header id="top-bar">
  <h1>Datacenter Clicker</h1>
  <div id="era-banner"></div>
</header>

<div id="status-bar">
  <span id="status-time">📅 Day 0 • Nov 30, 2022, 12:00 AM</span>
  <span id="status-flops">🧠 0 FLOPS/s</span>
  <div id="clock-speed-wrap">
    <label for="clock-speed-slider">⏩ Clock Speed: <span id="clock-speed-label">1x</span></label>
    <input type="range" id="clock-speed-slider" min="0" max="20" step="0.5" value="1">
  </div>
</div>

<div id="resource-bar"></div>
<div id="electricity-bar"></div>

<main>
  <section id="actions-panel">
    <h2>Actions</h2>
    <div id="core-actions" class="action-row">
      <button id="btn-freelance">💻 Freelance Gig<span class="hint">+cash per click</span></button>
    </div>
    <div id="compute-actions" class="action-row compute-alloc-row">
      <button id="btn-auto-convert" class="toggle-btn">🔁 Auto-Convert Compute: OFF<span class="hint">continuously converts compute → cash/reputation</span></button>
      <div id="alloc-slider-wrap">
        <label for="alloc-slider">💸 Sell <span id="alloc-sell-pct">50</span>% &nbsp;/&nbsp; 🎯 Train <span id="alloc-train-pct">50</span>%</label>
        <input type="range" id="alloc-slider" min="0" max="100" value="50" step="5">
      </div>
    </div>
    <div id="influence-actions" class="action-row">
      <button id="btn-schmooze">🤝 Schmooze Politician<span class="hint">+influence per click</span></button>
    </div>
  </section>

  <section id="buildings-panel">
    <h2>Buildings</h2>
    <div id="buildings-list" class="card-grid"></div>
  </section>

  <section id="upgrades-panel">
    <h2>Upgrades</h2>
    <div id="upgrades-list" class="card-grid"></div>
  </section>

  <section id="log-panel">
    <h2>Log</h2>
    <div id="log-list"></div>
  </section>

  <section id="save-panel">
    <h2>Save</h2>
    <div class="action-row">
      <button id="btn-save">Save</button>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
      <button id="btn-reset">Reset Progress</button>
    </div>
    <textarea id="io-textarea" placeholder="Export/import save string goes here"></textarea>
  </section>
</main>

<div id="flash-message"></div>

<script src="js/core/config.js"></script>
<script src="js/core/devmode.js"></script>
<script src="js/core/format.js"></script>
<script src="js/data/resources.js"></script>
<script src="js/data/eras.js"></script>
<script src="js/data/buildings.js"></script>
<script src="js/data/upgrades.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/save.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
